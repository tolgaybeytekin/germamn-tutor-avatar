workflows:
  ios-capacitor-workflow:
    name: German Tutor iOS Build
    max_build_duration: 60
    environment:
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build unsigned iOS app
        script: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
    artifacts:
      - build/ios/*.app
